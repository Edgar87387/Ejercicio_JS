<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>

    <link rel="stylesheet" href="Estilos.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <script src="Eventos.js" defer></script>
</head>

<body>

    <div class="container">
        <h1>Iniciar sesión</h1>
        <form id="loginForm">

            <div class="input-box">
                <input type="text" id="usuario" placeholder="Correo" required>

                <i class='bx bx-user'></i>
            </div>

            <div class="input-box">
                <input type="password" id="password" placeholder="Contraseña" required>

                <i class='bx bx-lock'></i>
            </div>

            <p id="loginError" class="login-error">
                ¡El usuario o la contraseña son incorrectos!
            </p>

            <div class="remember-password">

                <label>
                    <input type="checkbox">
                    Guardar Contraseña
                </label>

                <a href="#" id="forgotPassword">
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

            <button type="submit" class="btn">
                Iniciar
            </button>

            <p class="register-link">
                ¿No tienes cuenta?
                <a href="#">Registrate</a>
            </p>

        </form>
    </div>


    
    <div class="modal-overlay" id="passwordModal">

        <div class="modal">

            <button class="close-btn" id="closeModal">
                <i class='bx bx-x'></i>
            </button>

            <label for="resetEmail">
                Escribe tu correo electrónico:
            </label>

            <input type="email" id="resetEmail" placeholder="Ejemplo@gmail.com">

            <p class="modal-text">
                Se te enviará un link para restablecer tu contraseña
            </p>

            <button class="reset-btn" id="resetButton">
                Restablecer contraseña
            </button>

            <p id="resetMessage" class="reset-message"></p>

        </div>

    </div>

</body>
</html>
